[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "sym-img"
version = "0.1.0"
description = "Code for symbolic imagination paper"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "hydra-core>=1.3.2",
    "ipdb>=0.13.13",
]

[project.optional-dependencies]
develop = ["pytest>=7.2.2", "pytest-xdist>=3.8.0", "ruff", "ty"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sym_img = ["py.typed"]

[tool.ruff]
line-length = 128
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "D", "UP", "PL"]
ignore = [
    "D203", # 1 blank line required before class docstring (incompatible with D211)
    "D213", # Multi-line docstring summary should start at the second line (incompatible with D212)
    "F722", # jaxtyping uses strings in annotations that are not forward references (see ruff#9860)
]

[tool.ruff.lint.pylint]
max-args = 10
max-branches = 30
max-statements = 150

[tool.ruff.lint.isort]
known-first-party = ["sym_img"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.analysis]
respect-type-ignore-comments = true

[tool.uv.sources]
sym-img = { workspace = true }

[dependency-groups]
dev = ["sym-img"]
